name: Deploy Next.js to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  CI: "true"

jobs:
  build:
    name: Build GitHub Pages Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            echo "package-lock.json found — using npm ci"
            npm ci --no-audit --no-fund
          else
            echo "package-lock.json not found — using npm install"
            npm install --no-audit --no-fund
          fi

      - name: Build Next.js static site
        shell: bash
        run: |
          set -euo pipefail
          npm run build

      - name: Verify GitHub Pages export
        shell: bash
        run: |
          set -euo pipefail

          test -d out

          test -f out/index.html
          test -f out/cases/index.html
          test -f out/cases/CASE-2026-00001/index.html
          test -f out/cases/CASE-2026-00014/index.html
          test -f out/officer-review/index.html
          test -f out/manager-approval/index.html
          test -f out/corrections-verification/index.html
          test -f out/analytics/index.html
          test -f out/data-integrity/index.html
          test -f out/reports-audit/index.html

          echo "GitHub Pages static export verified"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out


  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5