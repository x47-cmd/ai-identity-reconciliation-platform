name: Frontend Build & Smoke Test

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "app/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - ".github/workflows/frontend-build.yml"

jobs:
  build-and-test:
    name: Build & Test Static Next.js Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json found — using npm ci"
            npm ci
          else
            echo "package-lock.json not found — using npm install"
            npm install
          fi

      - name: Build static frontend
        run: npm run build

      - name: Verify static export
        run: |
          test -d out

          test -f out/index.html
          test -f out/cases/index.html
          test -f out/cases/CASE-2026-00001/index.html
          test -f out/cases/CASE-2026-00014/index.html
          test -f out/officer-review/index.html
          test -f out/manager-approval/index.html
          test -f out/corrections-verification/index.html
          test -f out/analytics/index.html
          test -f out/data-integrity/index.html
          test -f out/reports-audit/index.html

          echo "Static export files verified"

      - name: Start static test server
        run: |
          python3 -m http.server 3000 --directory out > /tmp/frontend.log 2>&1 &
          echo $! > /tmp/frontend.pid

      - name: Wait for frontend
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/ > /dev/null; then
              echo "Static frontend is ready"
              exit 0
            fi

            echo "Waiting for frontend..."
            sleep 2
          done

          echo "Frontend failed to start"
          cat /tmp/frontend.log
          exit 1

      - name: Smoke test routes
        run: |
          set -e

          routes=(
            "/"
            "/cases/"
            "/cases/CASE-2026-00001/"
            "/cases/CASE-2026-00014/"
            "/officer-review/"
            "/manager-approval/"
            "/corrections-verification/"
            "/analytics/"
            "/data-integrity/"
            "/reports-audit/"
          )

          for route in "${routes[@]}"; do
            echo "Testing $route"

            curl \
              --location \
              --fail \
              --silent \
              --show-error \
              "http://localhost:3000$route" \
              > /dev/null

            echo "PASS $route"
          done

      - name: Show static server log on failure
        if: failure()
        run: |
          echo "===== STATIC FRONTEND SERVER LOG ====="
          cat /tmp/frontend.log || true

      - name: Stop static test server
        if: always()
        run: |
          if [ -f /tmp/frontend.pid ]; then
            kill "$(cat /tmp/frontend.pid)" || true
          fi