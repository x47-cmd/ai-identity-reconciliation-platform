name: Frontend Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - ".github/workflows/frontend-build.yml"

jobs:
  build:
    name: Build Next.js Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build