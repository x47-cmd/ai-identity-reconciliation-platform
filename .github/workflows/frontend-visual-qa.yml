name: Frontend Visual QA

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"

jobs:
  visual-qa:
    name: Capture Static Frontend Screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            echo "package-lock.json found — using npm ci"
            npm ci --no-audit --no-fund
          else
            echo "package-lock.json not found — using npm install"
            npm install --no-audit --no-fund
          fi

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail

          npm install \
            --no-save \
            --no-package-lock \
            --no-audit \
            --no-fund \
            playwright

          npx playwright install --with-deps chromium

      - name: Build static frontend
        shell: bash
        run: |
          set -euo pipefail
          npm run build

      - name: Verify static export
        shell: bash
        run: |
          set -euo pipefail

          test -d out

          test -f out/index.html
          test -f out/cases/index.html
          test -f out/cases/CASE-2026-00001/index.html
          test -f out/cases/CASE-2026-00014/index.html
          test -f out/officer-review/index.html
          test -f out/manager-approval/index.html
          test -f out/corrections-verification/index.html
          test -f out/analytics/index.html
          test -f out/data-integrity/index.html
          test -f out/reports-audit/index.html

          echo "Static export verified"

      - name: Start static test server
        shell: bash
        run: |
          set -euo pipefail

          python3 \
            -m http.server 3000 \
            --directory out \
            > /tmp/frontend.log 2>&1 &

          echo $! > /tmp/frontend.pid

      - name: Wait for frontend
        shell: bash
        run: |
          set -euo pipefail

          for i in {1..30}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:3000/ \
              > /dev/null
            then
              echo "Static frontend is ready"
              exit 0
            fi

            echo "Waiting for frontend... attempt $i/30"
            sleep 2
          done

          echo "Frontend failed to start"
          cat /tmp/frontend.log || true
          exit 1

      - name: Capture screenshots
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p visual-qa

          cat > capture.mjs <<'EOF'
          import { chromium } from "playwright";

          const browser = await chromium.launch({
            headless: true,
          });

          const context = await browser.newContext({
            viewport: {
              width: 1440,
              height: 1000,
            },
            deviceScaleFactor: 1,
          });

          const pages = [
            {
              name: "01-command-center",
              route: "/",
            },
            {
              name: "02-cases",
              route: "/cases/",
            },
            {
              name: "03-case-00001",
              route: "/cases/CASE-2026-00001/",
            },
            {
              name: "04-case-00014",
              route: "/cases/CASE-2026-00014/",
            },
            {
              name: "05-officer-review",
              route: "/officer-review/",
            },
            {
              name: "06-manager-approval",
              route: "/manager-approval/",
            },
            {
              name: "07-corrections-verification",
              route: "/corrections-verification/",
            },
            {
              name: "08-analytics",
              route: "/analytics/",
            },
            {
              name: "09-data-integrity",
              route: "/data-integrity/",
            },
            {
              name: "10-reports-audit",
              route: "/reports-audit/",
            },
          ];

          let failed = false;

          for (const item of pages) {
            const page = await context.newPage();

            page.on("pageerror", (error) => {
              console.error(
                `[PAGE ERROR] ${item.route}: ${error.message}`
              );

              failed = true;
            });

            page.on("console", (message) => {
              if (message.type() === "error") {
                console.error(
                  `[CONSOLE ERROR] ${item.route}: ${message.text()}`
                );

                failed = true;
              }
            });

            console.log(
              `Opening ${item.route}`
            );

            try {
              const response = await page.goto(
                `http://127.0.0.1:3000${item.route}`,
                {
                  waitUntil: "networkidle",
                  timeout: 30000,
                }
              );

              if (
                !response ||
                !response.ok()
              ) {
                console.error(
                  `Failed ${item.route}: HTTP ${
                    response
                      ? response.status()
                      : "NO RESPONSE"
                  }`
                );

                failed = true;
              }

              await page.screenshot({
                path: `visual-qa/${item.name}.png`,
                fullPage: true,
              });

              console.log(
                `Captured ${item.name}.png`
              );
            } catch (error) {
              console.error(
                `[CAPTURE ERROR] ${item.route}: ${error.message}`
              );

              failed = true;
            } finally {
              await page.close();
            }
          }

          await browser.close();

          if (failed) {
            process.exitCode = 1;
          }
          EOF

          node capture.mjs

      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-visual-qa
          path: visual-qa/
          retention-days: 14
          if-no-files-found: warn

      - name: Show static server log on failure
        if: failure()
        shell: bash
        run: |
          echo "===== STATIC FRONTEND SERVER LOG ====="
          cat /tmp/frontend.log || true

      - name: Stop static test server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/frontend.pid ]; then
            kill "$(cat /tmp/frontend.pid)" || true
          fi