name: Run AI Identity Reconciliation Demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-ai-demo:

    name: Full AI Reconciliation Demo

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. CHECKOUT REPOSITORY
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # 2. SETUP PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ======================================================
      # 3. DISPLAY ENVIRONMENT
      # ======================================================

      - name: Display environment
        run: |
          echo "============================================"
          echo " AI Identity Reconciliation Platform"
          echo " Full Automated End-to-End Demo"
          echo "============================================"
          echo ""
          python --version


      # ======================================================
      # 4. GENERATE SYNTHETIC DATA
      # ======================================================

      - name: Generate synthetic data
        run: |
          echo ""
          echo "============================================"
          echo " STEP 1 - SYNTHETIC DATA GENERATION"
          echo "============================================"

          python synthetic-data/generate_data.py


      # ======================================================
      # 5. VERIFY SYNTHETIC DATA
      # ======================================================

      - name: Verify synthetic datasets
        run: |
          test -f synthetic-data/output/master_persons.csv
          test -f synthetic-data/output/biometric_records.csv
          test -f synthetic-data/output/ground_truth.csv
          test -f synthetic-data/output/demo_summary.json

          echo "Synthetic datasets verified successfully."


      # ======================================================
      # 6. RUN RECONCILIATION ENGINE
      # ======================================================

      - name: Run reconciliation engine
        run: |
          echo ""
          echo "============================================"
          echo " STEP 2 - RECONCILIATION ENGINE"
          echo "============================================"

          python reconciliation-engine/reconcile.py


      # ======================================================
      # 7. VERIFY RECONCILIATION OUTPUT
      # ======================================================

      - name: Verify reconciliation results
        run: |
          test -f reconciliation-engine/output/findings.csv
          test -f reconciliation-engine/output/reconciliation_summary.json

          echo "Reconciliation results verified successfully."


      # ======================================================
      # 8. RUN PERFORMANCE EVALUATION
      # ======================================================

      - name: Evaluate detection performance
        run: |
          echo ""
          echo "============================================"
          echo " STEP 3 - PERFORMANCE EVALUATION"
          echo "============================================"

          python evaluation/evaluate_detection.py


      # ======================================================
      # 9. VERIFY PERFORMANCE OUTPUT
      # ======================================================

      - name: Verify evaluation results
        run: |
          test -f evaluation/output/performance_report.json
          test -f evaluation/output/case_evaluation.csv

          echo "Performance evaluation completed successfully."


      # ======================================================
      # 10. RUN DIAGNOSTIC ANALYSIS
      # ======================================================

      - name: Run diagnostic analysis
        run: |
          echo ""
          echo "============================================"
          echo " STEP 4 - DIAGNOSTIC ANALYSIS"
          echo "============================================"

          python evaluation/diagnose_results.py


      # ======================================================
      # 11. VERIFY DIAGNOSTIC OUTPUT
      # ======================================================

      - name: Verify diagnostic results
        run: |
          test -f evaluation/output/diagnostic_report.json
          test -f evaluation/output/false_positive_diagnostics.csv

          echo "Diagnostic analysis completed successfully."


      # ======================================================
      # 12. RUN CASE AGGREGATION ENGINE
      # ======================================================

      - name: Build investigation cases
        run: |
          echo ""
          echo "============================================"
          echo " STEP 5 - CASE AGGREGATION"
          echo "============================================"

          python case-engine/build_cases.py


      # ======================================================
      # 13. VERIFY CASE AGGREGATION OUTPUT
      # ======================================================

      - name: Verify case aggregation results
        run: |
          test -f case-engine/output/cases.csv
          test -f case-engine/output/cases.json
          test -f case-engine/output/case_findings.csv
          test -f case-engine/output/case_summary.json

          echo "Case aggregation completed successfully."


      # ======================================================
      # 14. DISPLAY CASE AGGREGATION RESULTS
      # ======================================================

      - name: Display case aggregation results
        run: |
          python - <<'PY'

          import csv
          import json
          from pathlib import Path


          summary_path = Path(
              "case-engine/output/case_summary.json"
          )

          cases_path = Path(
              "case-engine/output/cases.csv"
          )


          with summary_path.open(
              "r",
              encoding="utf-8"
          ) as file:

              summary = json.load(file)


          with cases_path.open(
              "r",
              encoding="utf-8",
              newline=""
          ) as file:

              cases = list(
                  csv.DictReader(file)
              )


          print()
          print(
              "============================================"
          )

          print(
              " CASE AGGREGATION RESULTS"
          )

          print(
              "============================================"
          )


          print(
              f"Raw Findings: "
              f"{summary['raw_findings']}"
          )

          print(
              f"Aggregated Cases: "
              f"{summary['aggregated_cases']}"
          )

          print(
              f"Corroborating Findings Collapsed: "
              f"{summary['findings_collapsed_into_existing_cases']}"
          )

          print(
              f"Multi-Finding Cases: "
              f"{summary['multi_finding_cases']}"
          )

          print(
              f"Wrongly Affected Cases: "
              f"{summary['wrongly_affected_cases']}"
          )

          print(
              f"Unresolved Identity Cases: "
              f"{summary['unresolved_identity_cases']}"
          )


          print()
          print(
              "Priority Breakdown:"
          )


          for priority, count in (
              summary[
                  "priority_breakdown"
              ].items()
          ):

              print(
                  f" - {priority}: {count}"
              )


          print()
          print(
              "Case Type Breakdown:"
          )


          for case_type, count in (
              summary[
                  "case_type_breakdown"
              ].items()
          ):

              print(
                  f" - {case_type}: {count}"
              )


          print()
          print(
              "============================================"
          )

          print(
              " BIO-000795 VALIDATION"
          )

          print(
              "============================================"
          )


          matching_cases = [

              case

              for case in cases

              if "BIO-000795" in (
                  case[
                      "affected_biometric_ids"
                  ]
              ).split(",")

          ]


          if not matching_cases:

              print(
                  "BIO-000795 was not found in any case."
              )

          else:

              for case in matching_cases:

                  print(
                      f"Case ID: "
                      f"{case['case_id']}"
                  )

                  print(
                      f"Case Type: "
                      f"{case['case_type']}"
                  )

                  print(
                      f"Priority: "
                      f"{case['priority']}"
                  )

                  print(
                      f"Canonical Identity: "
                      f"{case['canonical_master_id']}"
                  )

                  print(
                      f"Canonical Confidence: "
                      f"{case['canonical_identity_confidence']}"
                  )

                  print(
                      f"Finding Count: "
                      f"{case['finding_count']}"
                  )


          print()

          PY


      # ======================================================
      # 15. RUN COMPLETE END-TO-END DEMO
      # ======================================================

      - name: Run end-to-end AI case lifecycle
        run: |
          echo ""
          echo "============================================"
          echo " STEP 6 - END-TO-END AI CASE LIFECYCLE"
          echo "============================================"
          echo ""
          echo "AI Investigation"
          echo "→ Officer Review"
          echo "→ Manager Approval"
          echo "→ Authorized Execution"
          echo "→ Verification"
          echo "→ Case Closure"
          echo ""

          python demo/run_end_to_end_demo.py


      # ======================================================
      # 16. VERIFY END-TO-END OUTPUT
      # ======================================================

      - name: Verify end-to-end demo
        run: |
          test -f demo/output/end_to_end_demo_report.json
          test -f demo/output/end_to_end_audit_timeline.csv
          test -f demo/output/selected_demo_case.json

          test -f ai-agents/investigation-agent/output/investigations.json
          test -f ai-agents/investigation-agent/output/investigation_summary.json

          test -f ai-agents/approval-workflow-agent/output/approval_state.json
          test -f ai-agents/approval-workflow-agent/output/approval_audit.json

          test -f ai-agents/execution-agent/output/execution_results.csv
          test -f ai-agents/execution-agent/output/execution_summary.json

          test -f ai-agents/verification-agent/output/verification_results.csv
          test -f ai-agents/verification-agent/output/verification_summary.json

          python - <<'PY'

          import json
          from pathlib import Path


          report_path = Path(
              "demo/output/end_to_end_demo_report.json"
          )


          with report_path.open(
              "r",
              encoding="utf-8"
          ) as file:

              report = json.load(file)


          if not report.get(
              "demo_success"
          ):

              raise SystemExit(
                  "End-to-end demo did not reach "
                  "VERIFIED_CLOSED status."
              )


          if (
              report.get(
                  "final_case_status"
              )
              !=
              "VERIFIED_CLOSED"
          ):

              raise SystemExit(
                  "Selected case was not closed "
                  "after verification."
              )


          verification = (
              report.get(
                  "verification"
              )
              or {}
          )


          if (
              verification.get(
                  "verification_status"
              )
              !=
              "PASSED"
          ):

              raise SystemExit(
                  "Post-correction verification "
                  "did not pass."
              )


          print(
              "End-to-end lifecycle verified successfully."
          )

          PY


      # ======================================================
      # 17. DISPLAY END-TO-END DEMO RESULT
      # ======================================================

      - name: Display end-to-end case lifecycle
        run: |
          python - <<'PY'

          import json
          from pathlib import Path


          path = Path(
              "demo/output/end_to_end_demo_report.json"
          )


          with path.open(
              "r",
              encoding="utf-8"
          ) as file:

              report = json.load(file)


          selected = (
              report[
                  "selected_case"
              ]
          )

          approval = (
              report[
                  "human_approval"
              ]
          )

          execution = (
              report.get(
                  "execution"
              )
              or {}
          )

          verification = (
              report.get(
                  "verification"
              )
              or {}
          )


          print()
          print(
              "============================================"
          )

          print(
              " END-TO-END AI CASE LIFECYCLE"
          )

          print(
              "============================================"
          )


          print()
          print(
              "SELECTED HIGH-PRIORITY CASE"
          )

          print(
              "--------------------------------------------"
          )


          print(
              f"Case ID: "
              f"{selected['case_id']}"
          )

          print(
              f"Case Type: "
              f"{selected['case_type']}"
          )

          print(
              f"Priority: "
              f"{selected['priority']}"
          )

          print(
              f"Wrongly Affected Person: "
              f"{selected['wrongly_affected_person']}"
          )

          print(
              f"Biometric Record: "
              f"{selected['primary_biometric_id']}"
          )

          print(
              f"Current Identity: "
              f"{selected['current_identity']}"
          )

          print(
              f"AI Proposed Identity: "
              f"{selected['ai_proposed_identity']}"
          )

          print(
              f"AI Confidence: "
              f"{selected['ai_confidence']}"
          )

          print(
              f"Risk Score: "
              f"{selected['risk_score']}"
          )

          print(
              f"Harm Impact: "
              f"{selected['harm_impact_score']}"
          )

          print(
              f"Protective Priority: "
              f"{selected['protective_priority_score']}"
          )


          print()
          print(
              "HUMAN-IN-THE-LOOP APPROVAL"
          )

          print(
              "--------------------------------------------"
          )


          print(
              f"Monitoring Officer: "
              f"{approval['monitoring_officer']}"
          )

          print(
              f"Officer Decision: "
              f"{approval['monitoring_officer_decision']}"
          )

          print(
              f"Manager: "
              f"{approval['manager']}"
          )

          print(
              f"Manager Decision: "
              f"{approval['manager_decision']}"
          )


          print()
          print(
              "AUTHORIZED CORRECTION"
          )

          print(
              "--------------------------------------------"
          )


          print(
              f"Execution Status: "
              f"{execution.get('execution_status')}"
          )

          print(
              f"Target Record: "
              f"{execution.get('target_record')}"
          )

          print(
              f"Before: "
              f"{execution.get('before')}"
          )

          print(
              f"After: "
              f"{execution.get('after')}"
          )


          print()
          print(
              "POST-CORRECTION VERIFICATION"
          )

          print(
              "--------------------------------------------"
          )


          print(
              f"Verification Status: "
              f"{verification.get('verification_status')}"
          )

          print(
              f"Verification Score: "
              f"{verification.get('verification_score')}"
          )

          print(
              f"Biometric Match Score: "
              f"{verification.get('biometric_match_score')}"
          )

          print(
              f"Identity Mapping Valid: "
              f"{verification.get('identity_mapping_valid')}"
          )

          print(
              f"Conflict Resolved: "
              f"{verification.get('original_conflict_resolved')}"
          )

          print(
              f"Secondary Conflict: "
              f"{verification.get('secondary_conflict_created')}"
          )


          print()
          print(
              "FINAL RESULT"
          )

          print(
              "--------------------------------------------"
          )


          print(
              f"Final Case Status: "
              f"{report['final_case_status']}"
          )

          print(
              f"Audit Trail Events: "
              f"{report['audit_timeline_events']}"
          )

          print(
              f"Master Reference Modified: "
              f"{report['master_reference_modified']}"
          )

          print(
              f"Original Biometric Dataset Modified: "
              f"{report['original_biometric_dataset_modified']}"
          )


          print()


          if report[
              "demo_success"
          ]:

              print(
                  "DEMO STATUS:"
              )

              print(
                  "SUCCESS - CASE VERIFIED AND CLOSED"
              )

          else:

              print(
                  "DEMO STATUS:"
              )

              print(
                  "ATTENTION REQUIRED"
              )


          print()

          PY


      # ======================================================
      # 18. DISPLAY EXECUTIVE PERFORMANCE
      # ======================================================

      - name: Display executive metrics
        run: |
          python - <<'PY'

          import json
          from pathlib import Path


          performance_path = Path(
              "evaluation/output/performance_report.json"
          )


          with performance_path.open(
              "r",
              encoding="utf-8"
          ) as file:

              report = json.load(file)


          overall = report[
              "overall_performance"
          ]

          identity = report[
              "identity_resolution"
          ]

          protective = report[
              "protective_priority"
          ]


          print()
          print(
              "============================================"
          )

          print(
              " EXECUTIVE AI PERFORMANCE"
          )

          print(
              "============================================"
          )


          print(
              f"Raw Precision: "
              f"{overall['precision']}%"
          )

          print(
              f"Recall: "
              f"{overall['recall']}%"
          )

          print(
              f"F1 Score: "
              f"{overall['f1_score']}%"
          )

          print(
              f"Raw Identity Resolution Accuracy: "
              f"{identity['accuracy']}%"
          )

          print(
              f"Protective Detection Recall: "
              f"{protective['detection_recall']}%"
          )

          print(
              f"Protective Priority Accuracy: "
              f"{protective['priority_accuracy']}%"
          )

          print(
              f"Expected Synthetic Issues: "
              f"{overall['total_ground_truth_cases']}"
          )

          print(
              f"Detected Synthetic Issues: "
              f"{overall['detected_ground_truth_cases']}"
          )

          print(
              f"Missed Issues: "
              f"{overall['missed_ground_truth_cases']}"
          )

          print(
              f"Original False Positive Findings: "
              f"{overall['false_positive_findings']}"
          )


          print()

          PY


      # ======================================================
      # 19. DISPLAY DIAGNOSTIC RESULTS
      # ======================================================

      - name: Display false positive diagnostics
        run: |
          python - <<'PY'

          import json
          from pathlib import Path


          path = Path(
              "evaluation/output/diagnostic_report.json"
          )


          with path.open(
              "r",
              encoding="utf-8"
          ) as file:

              report = json.load(file)


          finding_analysis = report[
              "finding_level_analysis"
          ]

          case_analysis = report[
              "case_level_analysis"
          ]

          resolution = report[
              "identity_resolution_analysis"
          ]


          print()
          print(
              "============================================"
          )

          print(
              " FALSE POSITIVE DIAGNOSTIC RESULTS"
          )

          print(
              "============================================"
          )


          print(
              f"Original False Positive Findings: "
              f"{finding_analysis['original_false_positive_findings']}"
          )

          print(
              f"Secondary / Corroborating Findings: "
              f"{finding_analysis['secondary_or_corroborating_findings']}"
          )

          print(
              f"Unexplained False Positives: "
              f"{finding_analysis['unexplained_false_positive_findings']}"
          )

          print(
              f"Diagnostic Precision: "
              f"{finding_analysis['diagnostic_precision_excluding_secondary_findings']}%"
          )


          print()
          print(
              "RAW FINDING-LEVEL CASE METRICS"
          )


          print(
              f"Case-Level Precision: "
              f"{case_analysis['case_level_precision']}%"
          )

          print(
              f"Case-Level Recall: "
              f"{case_analysis['case_level_recall']}%"
          )

          print(
              f"Raw Identity Resolution Errors: "
              f"{resolution['resolution_errors']}"
          )


          print()

          PY


      # ======================================================
      # 20. DISPLAY IDENTITY RESOLUTION ERRORS
      # ======================================================

      - name: Display identity resolution errors
        run: |
          python - <<'PY'

          import json
          from pathlib import Path


          path = Path(
              "evaluation/output/diagnostic_report.json"
          )


          with path.open(
              "r",
              encoding="utf-8"
          ) as file:

              report = json.load(file)


          errors = report[
              "identity_resolution_analysis"
          ][
              "error_records"
          ]


          print()
          print(
              "============================================"
          )

          print(
              " RAW IDENTITY RESOLUTION ERROR DETAILS"
          )

          print(
              "============================================"
          )


          if not errors:

              print(
                  "No raw identity resolution errors detected."
              )


          for error in errors:

              print()

              print(
                  f"Biometric ID: "
                  f"{error['biometric_id']}"
              )

              print(
                  f"Anomaly Type: "
                  f"{error['anomaly_type']}"
              )

              print(
                  f"Expected Identity: "
                  f"{error['expected_correct_master_id']}"
              )

              print(
                  f"Detected Identity: "
                  f"{error['detected_correct_master_id']}"
              )

              print(
                  f"Current Link: "
                  f"{error['current_linked_master_id']}"
              )

              print(
                  f"Related Biometric: "
                  f"{error['related_biometric_id']}"
              )

              print(
                  f"AI Confidence: "
                  f"{error['ai_confidence']}"
              )


          print()
          print(
              "NOTE:"
          )

          print(
              "These are pre-aggregation raw finding metrics."
          )

          print(
              "Case-level canonical identity resolution "
              "is handled by the Case Aggregation Engine."
          )

          print()

          PY


      # ======================================================
      # 21. DISPLAY PROTECTIVE PRIORITY CASES
      # ======================================================

      - name: Display protective priority cases
        run: |
          python - <<'PY'

          import csv
          from pathlib import Path


          path = Path(
              "case-engine/output/cases.csv"
          )


          with path.open(
              "r",
              encoding="utf-8",
              newline=""
          ) as file:

              cases = list(
                  csv.DictReader(file)
              )


          protective_cases = [

              case

              for case in cases

              if str(
                  case[
                      "wrongly_affected_person"
                  ]
              ).lower() == "true"

          ]


          protective_cases.sort(

              key=lambda case:

                  float(
                      case[
                          "protective_priority_score"
                      ]
                      or 0
                  ),

              reverse=True
          )


          print()
          print(
              "============================================"
          )

          print(
              " PROTECTIVE PRIORITY CASES"
          )

          print(
              "============================================"
          )


          print(
              f"Total Wrongly Affected Cases: "
              f"{len(protective_cases)}"
          )


          for case in protective_cases:

              print()

              print(
                  f"{case['case_id']} | "
                  f"{case['case_type']} | "
                  f"{case['priority']}"
              )

              print(
                  f"Biometric: "
                  f"{case['primary_biometric_id']}"
              )

              print(
                  f"Canonical Identity: "
                  f"{case['canonical_master_id']}"
              )

              print(
                  f"Risk: "
                  f"{case['risk_score']}"
              )

              print(
                  f"Harm: "
                  f"{case['harm_impact_score']}"
              )

              print(
                  f"Protective Priority: "
                  f"{case['protective_priority_score']}"
              )


          print()

          PY


      # ======================================================
      # 22. DISPLAY ANOMALY BREAKDOWN
      # ======================================================

      - name: Display anomaly detection breakdown
        run: |
          python - <<'PY'

          import json
          from pathlib import Path


          path = Path(
              "evaluation/output/performance_report.json"
          )


          with path.open(
              "r",
              encoding="utf-8"
          ) as file:

              report = json.load(file)


          breakdown = report[
              "anomaly_type_breakdown"
          ]


          print()
          print(
              "============================================"
          )

          print(
              " ANOMALY DETECTION BREAKDOWN"
          )

          print(
              "============================================"
          )


          for anomaly, result in breakdown.items():

              print(
                  f"{anomaly}: "
                  f"{result['detected']} / "
                  f"{result['expected']} "
                  f"| Recall: "
                  f"{result['recall']}%"
              )


          print()

          PY


      # ======================================================
      # 23. CREATE FINAL COMBINED REPORT
      # ======================================================

      - name: Create final demo run summary
        run: |
          mkdir -p demo-output

          python - <<'PY'

          import json
          from pathlib import Path
          from datetime import datetime


          demo_path = Path(
              "synthetic-data/output/demo_summary.json"
          )

          reconciliation_path = Path(
              "reconciliation-engine/output/reconciliation_summary.json"
          )

          performance_path = Path(
              "evaluation/output/performance_report.json"
          )

          diagnostic_path = Path(
              "evaluation/output/diagnostic_report.json"
          )

          case_summary_path = Path(
              "case-engine/output/case_summary.json"
          )

          investigation_summary_path = Path(
              "ai-agents/investigation-agent/output/investigation_summary.json"
          )

          verification_summary_path = Path(
              "ai-agents/verification-agent/output/verification_summary.json"
          )

          end_to_end_path = Path(
              "demo/output/end_to_end_demo_report.json"
          )


          with demo_path.open(
              "r",
              encoding="utf-8"
          ) as file:

              demo = json.load(file)


          with reconciliation_path.open(
              "r",
              encoding="utf-8"
          ) as file:

              reconciliation = json.load(file)


          with performance_path.open(
              "r",
              encoding="utf-8"
          ) as file:

              performance = json.load(file)


          with diagnostic_path.open(
              "r",
              encoding="utf-8"
          ) as file:

              diagnostic = json.load(file)


          with case_summary_path.open(
              "r",
              encoding="utf-8"
          ) as file:

              case_summary = json.load(file)


          with investigation_summary_path.open(
              "r",
              encoding="utf-8"
          ) as file:

              investigation = json.load(file)


          with verification_summary_path.open(
              "r",
              encoding="utf-8"
          ) as file:

              verification = json.load(file)


