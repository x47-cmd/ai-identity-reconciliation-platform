name: Run AI Identity Reconciliation Demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-ai-demo:

    name: Full AI Reconciliation Demo

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. CHECKOUT REPOSITORY
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # 2. SETUP PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ======================================================
      # 3. DISPLAY ENVIRONMENT
      # ======================================================

      - name: Display environment
        run: |
          echo "============================================"
          echo " AI Identity Reconciliation Platform"
          echo " Full Automated Demo"
          echo "============================================"
          echo ""
          python --version


      # ======================================================
      # 4. GENERATE SYNTHETIC DATA
      # ======================================================

      - name: Generate synthetic data
        run: |
          echo ""
          echo "============================================"
          echo " STEP 1 - SYNTHETIC DATA GENERATION"
          echo "============================================"
          python synthetic-data/generate_data.py


      # ======================================================
      # 5. VERIFY SYNTHETIC DATA
      # ======================================================

      - name: Verify synthetic datasets
        run: |
          test -f synthetic-data/output/master_persons.csv
          test -f synthetic-data/output/biometric_records.csv
          test -f synthetic-data/output/ground_truth.csv
          test -f synthetic-data/output/demo_summary.json

          echo "Synthetic datasets verified successfully."


      # ======================================================
      # 6. RUN RECONCILIATION ENGINE
      # ======================================================

      - name: Run reconciliation engine
        run: |
          echo ""
          echo "============================================"
          echo " STEP 2 - RECONCILIATION ENGINE"
          echo "============================================"
          python reconciliation-engine/reconcile.py


      # ======================================================
      # 7. VERIFY RECONCILIATION OUTPUT
      # ======================================================

      - name: Verify reconciliation results
        run: |
          test -f reconciliation-engine/output/findings.csv
          test -f reconciliation-engine/output/reconciliation_summary.json

          echo "Reconciliation results verified successfully."


      # ======================================================
      # 8. RUN PERFORMANCE EVALUATION
      # ======================================================

      - name: Evaluate detection performance
        run: |
          echo ""
          echo "============================================"
          echo " STEP 3 - PERFORMANCE EVALUATION"
          echo "============================================"
          python evaluation/evaluate_detection.py


      # ======================================================
      # 9. VERIFY EVALUATION OUTPUT
      # ======================================================

      - name: Verify evaluation results
        run: |
          test -f evaluation/output/performance_report.json
          test -f evaluation/output/case_evaluation.csv

          echo "Performance evaluation completed successfully."


      # ======================================================
      # 10. DISPLAY SYNTHETIC DATA SUMMARY
      # ======================================================

      - name: Display synthetic data summary
        run: |
          echo ""
          echo "============================================"
          echo " SYNTHETIC DATA SUMMARY"
          echo "============================================"

          cat synthetic-data/output/demo_summary.json


      # ======================================================
      # 11. DISPLAY RECONCILIATION SUMMARY
      # ======================================================

      - name: Display reconciliation summary
        run: |
          echo ""
          echo "============================================"
          echo " RECONCILIATION SUMMARY"
          echo "============================================"

          cat reconciliation-engine/output/reconciliation_summary.json


      # ======================================================
      # 12. DISPLAY PERFORMANCE REPORT
      # ======================================================

      - name: Display AI performance report
        run: |
          echo ""
          echo "============================================"
          echo " AI DETECTION PERFORMANCE"
          echo "============================================"

          cat evaluation/output/performance_report.json


      # ======================================================
      # 13. DISPLAY EXECUTIVE METRICS
      # ======================================================

      - name: Display executive metrics
        run: |
          python - <<'PY'

          import json
          from pathlib import Path


          report_path = Path(
              "evaluation/output/performance_report.json"
          )

          with report_path.open(
              "r",
              encoding="utf-8"
          ) as file:

              report = json.load(file)


          overall = report[
              "overall_performance"
          ]

          identity = report[
              "identity_resolution"
          ]

          protective = report[
              "protective_priority"
          ]


          print()
          print(
              "============================================"
          )

          print(
              " EXECUTIVE AI PERFORMANCE"
          )

          print(
              "============================================"
          )


          print(
              f"Precision: "
              f"{overall['precision']}%"
          )

          print(
              f"Recall: "
              f"{overall['recall']}%"
          )

          print(
              f"F1 Score: "
              f"{overall['f1_score']}%"
          )


          print(
              f"Identity Resolution Accuracy: "
              f"{identity['accuracy']}%"
          )


          print(
              f"Protective Detection Recall: "
              f"{protective['detection_recall']}%"
          )

          print(
              f"Protective Priority Accuracy: "
              f"{protective['priority_accuracy']}%"
          )


          print(
              f"Expected Synthetic Issues: "
              f"{overall['total_ground_truth_cases']}"
          )

          print(
              f"Detected Synthetic Issues: "
              f"{overall['detected_ground_truth_cases']}"
          )

          print(
              f"Missed Issues: "
              f"{overall['missed_ground_truth_cases']}"
          )

          print(
              f"False Positive Findings: "
              f"{overall['false_positive_findings']}"
          )

          print()

          PY


      # ======================================================
      # 14. DISPLAY PROTECTIVE PRIORITY CASES
      # ======================================================

      - name: Display protective priority cases
        run: |
          python - <<'PY'

          import csv
          from pathlib import Path


          path = Path(
              "reconciliation-engine/output/findings.csv"
          )


          with path.open(
              "r",
              encoding="utf-8",
              newline=""
          ) as file:

              findings = list(
                  csv.DictReader(file)
              )


          protective_cases = [

              finding

              for finding in findings

              if str(
                  finding[
                      "wrongly_affected_person"
                  ]
              ).lower() == "true"

          ]


          protective_cases.sort(

              key=lambda finding:

                  float(
                      finding[
                          "protective_priority_score"
                      ]
                      or 0
                  ),

              reverse=True
          )


          print()
          print(
              "============================================"
          )

          print(
              " PROTECTIVE PRIORITY CASES"
          )

          print(
              "============================================"
          )


          print(
              f"Total Wrongly Affected Cases: "
              f"{len(protective_cases)}"
          )

          print()


          for finding in protective_cases:

              print(
                  f"{finding['finding_id']} | "
                  f"{finding['biometric_id']} | "
                  f"Current: "
                  f"{finding['current_master_id']} | "
                  f"Correct Candidate: "
                  f"{finding['suspected_correct_master_id']} | "
                  f"Risk: "
                  f"{finding['risk_score']} | "
                  f"Harm: "
                  f"{finding['harm_impact_score']} | "
                  f"Protective Priority: "
                  f"{finding['protective_priority_score']}"
              )

          print()

          PY


      # ======================================================
      # 15. DISPLAY TOP PRIORITY FINDINGS
      # ======================================================

      - name: Display highest priority findings
        run: |
          python - <<'PY'

          import csv
          from pathlib import Path


          path = Path(
              "reconciliation-engine/output/findings.csv"
          )


          with path.open(
              "r",
              encoding="utf-8",
              newline=""
          ) as file:

              findings = list(
                  csv.DictReader(file)
              )


          print()
          print(
              "============================================"
          )

          print(
              " TOP AI FINDINGS"
          )

          print(
              "============================================"
          )


          for finding in findings[:20]:

              print(
                  f"{finding['finding_id']} | "
                  f"{finding['finding_type']} | "
                  f"{finding['biometric_id']} | "
                  f"{finding['severity']} | "
                  f"Risk: "
                  f"{finding['risk_score']} | "
                  f"Harm: "
                  f"{finding['harm_impact_score']} | "
                  f"Priority: "
                  f"{finding['protective_priority_score']}"
              )

          print()

          PY


      # ======================================================
      # 16. DISPLAY ANOMALY TYPE PERFORMANCE
      # ======================================================

      - name: Display anomaly detection breakdown
        run: |
          python - <<'PY'

          import json
          from pathlib import Path


          path = Path(
              "evaluation/output/performance_report.json"
          )


          with path.open(
              "r",
              encoding="utf-8"
          ) as file:

              report = json.load(file)


          breakdown = report[
              "anomaly_type_breakdown"
          ]


          print()
          print(
              "============================================"
          )

          print(
              " ANOMALY DETECTION BREAKDOWN"
          )

          print(
              "============================================"
          )


          for anomaly, result in breakdown.items():

              print(
                  f"{anomaly}: "
                  f"{result['detected']} / "
                  f"{result['expected']} "
                  f"| Recall: "
                  f"{result['recall']}%"
              )

          print()

          PY


      # ======================================================
      # 17. CREATE DEMO RUN SUMMARY
      # ======================================================

      - name: Create final demo run summary
        run: |
          mkdir -p demo-output

          python - <<'PY'

          import json
          from pathlib import Path
          from datetime import datetime


          demo_summary_path = Path(
              "synthetic-data/output/demo_summary.json"
          )

          reconciliation_path = Path(
              "reconciliation-engine/output/reconciliation_summary.json"
          )

          performance_path = Path(
              "evaluation/output/performance_report.json"
          )


          with demo_summary_path.open(
              "r",
              encoding="utf-8"
          ) as file:

              demo = json.load(file)


          with reconciliation_path.open(
              "r",
              encoding="utf-8"
          ) as file:

              reconciliation = json.load(file)


          with performance_path.open(
              "r",
              encoding="utf-8"
          ) as file:

              performance = json.load(file)


          final_report = {

              "project":
                  "AI Identity Reconciliation Platform",

              "environment":
                  "Synthetic Demo Only",

              "run_status":
                  "COMPLETED",

              "generated_at":
                  datetime.now().isoformat(
                      timespec="seconds"
                  ),

              "dataset": {

                  "master_records":
                      demo[
                          "master_records"
                      ],

                  "biometric_records":
                      demo[
                          "biometric_records"
                      ],

                  "intentional_anomalies":
                      demo[
                          "intentional_anomalies"
                      ],

              },

              "reconciliation": {

                  "total_findings":
                      reconciliation[
                          "total_findings"
                      ],

                  "wrongly_affected_cases":
                      reconciliation[
                          "wrongly_affected_person_cases"
                      ],

                  "immediate_protective_priority_cases":
                      reconciliation[
                          "immediate_protective_priority_cases"
                      ],

              },

              "performance":

                  performance[
                      "overall_performance"
                  ],

              "identity_resolution":

                  performance[
                      "identity_resolution"
                  ],

              "protective_priority":

                  performance[
                      "protective_priority"
                  ],

              "anomaly_detection":

                  performance[
                      "anomaly_type_breakdown"
                  ],

          }


          output = Path(
              "demo-output/final_demo_report.json"
          )


          with output.open(
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  final_report,
                  file,
                  indent=4
              )


          print(
              json.dumps(
                  final_report,
                  indent=4
              )
          )

          PY


      # ======================================================
      # 18. UPLOAD ALL DEMO RESULTS
      # ======================================================

      - name: Upload complete AI demo results
        uses: actions/upload-artifact@v4
        with:
          name: ai-identity-reconciliation-full-demo
          path: |
            synthetic-data/output/
            reconciliation-engine/output/
            evaluation/output/
            demo-output/
          if-no-files-found: error
          retention-days: 7